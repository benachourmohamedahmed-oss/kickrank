<section class="auth-page">
  <form class="auth-card panel" [formGroup]="form" (ngSubmit)="submit()">
    <span class="badge gold">Nouveau joueur</span>
    <h1>Creer votre profil KickRank</h1>
    <label class="field">
      <span>Nom complet</span>
      <input formControlName="fullName" autocomplete="name">
    </label>
    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email">
    </label>
    <label class="field">
      <span>Mot de passe</span>
      <input type="password" formControlName="password" autocomplete="new-password">
    </label>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <button class="btn primary" type="submit" [disabled]="form.invalid">Creer le compte</button>
    <a routerLink="/login">J'ai deja un compte</a>
  </form>
</section>
