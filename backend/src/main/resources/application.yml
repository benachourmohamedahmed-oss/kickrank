server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: kickrank-api
  datasource:
    url: ${DB_URL:jdbc:h2:mem:kickrank;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

app:
  security:
    jwt-secret: ${JWT_SECRET:change-this-dev-secret-change-this-dev-secret}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  seed:
    admin-email: ${ADMIN_EMAIL:admin@kickrank.local}
    admin-password: ${ADMIN_PASSWORD:Admin12345}

logging:
  level:
    org.springframework.security: INFO
